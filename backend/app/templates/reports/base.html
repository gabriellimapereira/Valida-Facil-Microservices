<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4; margin: 2.2cm 1.8cm; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #0F172A; font-size: 11px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #D97706; padding-bottom: 12px; margin-bottom: 20px; }
  .brand { font-size: 18px; font-weight: bold; color: #0F172A; }
  .meta { text-align: right; color: #64748B; font-size: 10px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .subtitle { color: #64748B; font-size: 11px; margin: 0 0 18px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { background: #0F172A; color: #ffffff; text-align: left; padding: 7px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
  td { padding: 6px 8px; border-bottom: 1px solid #F1F5F9; font-size: 10.5px; }
  tr:nth-child(even) td { background: #F8FAFC; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 9px; font-weight: bold; }
  .badge-amber { background: #FEF3C7; color: #B45309; }
  .badge-red { background: #FEE2E2; color: #B91C1C; }
  .badge-teal { background: #CCFBF1; color: #0F766E; }
  .summary { display: flex; gap: 14px; margin-bottom: 18px; }
  .summary-card { flex: 1; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px 12px; }
  .summary-card .label { color: #64748B; font-size: 9px; text-transform: uppercase; }
  .summary-card .value { font-size: 16px; font-weight: bold; color: #0F172A; }
  .footer { margin-top: 24px; color: #94A3B8; font-size: 9px; text-align: center; }
</style>
</head>
<body>
  <div class="header">
    <span class="brand">Valida Fácil</span>
    <div class="meta">
      {{ company_name }}<br>
      Gerado em {{ generated_at }}
    </div>
  </div>

  <h1>{{ title }}</h1>
  {% if subtitle %}<p class="subtitle">{{ subtitle }}</p>{% endif %}

  {% block content %}{% endblock %}

  <p class="footer">Relatório gerado automaticamente pelo Valida Fácil — documento de uso interno.</p>
</body>
</html>
